name: Wrong or unclear answer
description: A question, note or flashcard that is wrong, out of date or ambiguous.
title: "Wrong answer: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A wrong answer teaches the wrong thing to everyone who studies with it.

        **Please don't paste or describe questions from a real exam sitting.** Report problems with the trainer's own content only.
  - type: dropdown
    id: where
    attributes:
      label: Where did you find it?
      options:
        - Drill
        - Practice exam
        - Exam Simulation (CCAR-F)
        - Exam Simulation (CCDV-F)
        - Flashcard
        - Study note
        - Lab
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    id: exam
    attributes:
      label: Certification
      options:
        - CCAO-F (Associate, Foundations)
        - CCDV-F (Developer, Foundations)
        - CCAR-F (Architect, Foundations)
        - CCAR-P (Architect, Professional)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
      description: The question id shown under its explanation (for example ar-d2-18), or for a flashcard or note, its heading. The "Report a problem" link in the app fills this in for you.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: Which answer the trainer gives, and what you believe is correct or unclear about it.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A link to the Anthropic documentation or exam guide that shows the right answer. Reports with a source can be fixed straight away.
      placeholder: https://code.claude.com/docs/...
  - type: input
    id: version
    attributes:
      label: Trainer version
      description: Shown at the foot of the sidebar.
      placeholder: "1.3.0"
