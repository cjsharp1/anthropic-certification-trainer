name: Bug report
description: Something in the app doesn't work or looks broken.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Exam Simulation
        2. Start a timed exam
        3. ...
  - type: input
    id: version
    attributes:
      label: Trainer version
      description: Shown at the foot of the sidebar.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Edge 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: copy
    attributes:
      label: How are you running it?
      options:
        - The downloaded release file
        - app/index.html from a clone of the repository
    validations:
      required: true
